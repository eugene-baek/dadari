<script>
(function () {
  const STORAGE_KEY = 'dadari_transactions_v1';

  const CATEGORIES = {
    expense: ['식비', '교통', '주거/공과금', '통신', '의료/건강', '쇼핑', '여가/문화', '경조사', '기타'],
    income: ['급여', '부수입', '용돈', '환급/이자', '기타']
  };

  const GOAL_KEY = 'dadari_goal_v1';
  const CARDS_KEY = 'dadari_cards_v1';
  const RECURS_KEY = 'dadari_recurs_v1';
  const DONE_KEY = 'dadari_recur_done_v1';
  const SYNC_KEY = 'dadari_sync_v1';   // 동기화 설정(저장소·토큰). 백업 파일에는 넣지 않는다
  const TOMB_KEY = 'dadari_tombs_v1';  // 삭제한 항목 id. 동기화할 때 지운 항목이 되살아나지 않게 한다
  const SYNC_PATH = 'dadari-data.json';
  const CAT_KEY = 'dadari_categories_v1';

  let transactions = load();
  let goal = loadGoal();
  let cards = loadJson(CARDS_KEY, []);       // {id, name, kind: 'credit'|'debit', payDay}  카드번호는 받지 않는다
  let recurs = loadJson(RECURS_KEY, []);     // {id, cardId|null, name, amount, day, category, auto, start}
  let recurDone = new Set(loadJson(DONE_KEY, [])); // 자동 기록을 이미 만든 "정기결제id:YYYY-MM"
  let tombs = new Set(loadJson(TOMB_KEY, []));
  let categories = loadCategories(); // CATEGORIES는 기본값. 사용자가 고친 목록은 여기에 둔다
  let applying = false;   // 동기화로 받은 데이터를 저장하는 중에는 "내가 고침"으로 보지 않는다
  let syncTimer = null;
  let syncing = false;
  let syncAgain = false;
  let currentType = 'expense';
  let onlyFixed = false;
  let viewDate = new Date();
  viewDate.setDate(1);

  const el = (id) => document.getElementById(id);
  const dateInput = el('f-date');
  const categorySelect = el('f-category');
  const form = el('entry-form');
  const typeToggle = el('type-toggle');

  dateInput.value = todayStr();
  renderCategoryOptions();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
    } catch (e) {
      showToast('저장 공간이 부족해 저장하지 못했어요');
    }
    markDirty();
  }

  function loadJson(key, fallback) {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      return v == null ? fallback : v;
    } catch (e) {
      return fallback;
    }
  }

  function saveJson(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      showToast('저장 공간이 부족해 저장하지 못했어요');
    }
    if (key !== SYNC_KEY && key !== VIEW_KEY) markDirty();
  }

  function loadCategories() {
    const v = loadJson(CAT_KEY, null);
    const ok = (a) => Array.isArray(a) && a.length > 0 && a.every((x) => typeof x === 'string' && x.trim());
    return v && ok(v.expense) && ok(v.income)
      ? { expense: v.expense, income: v.income }
      : { expense: [...CATEGORIES.expense], income: [...CATEGORIES.income] };
  }

  function tomb(...ids) {
    ids.forEach((id) => tombs.add(id));
    saveJson(TOMB_KEY, [...tombs]);
  }

  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function loadGoal() {
    try {
      return Math.max(0, parseInt(localStorage.getItem(GOAL_KEY), 10) || 0);
    } catch (e) {
      return 0;
    }
  }

  // toISOString은 UTC 기준이라 한국 시간 새벽(0~9시)에 전날 날짜가 나오므로 로컬 날짜로 만든다.
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function formatWon(n) {
    return Math.round(n).toLocaleString('ko-KR') + '원';
  }

  function renderCategoryOptions() {
    const prev = categorySelect.value;
    categorySelect.innerHTML = categories[currentType]
      .map((c) => `<option value="${escapeHtml(c).replace(/"/g, '&quot;')}">${escapeHtml(c)}</option>`)
      .join('');
    if (categories[currentType].includes(prev)) categorySelect.value = prev;
  }

  typeToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-type]');
    if (!btn) return;
    currentType = btn.dataset.type;
    [...typeToggle.children].forEach((b) => b.classList.toggle('active', b === btn));
    renderCategoryOptions();
    updatePayVisibility();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const amount = parseFloat(el('f-amount').value);
    if (!amount || amount <= 0) {
      showToast('금액을 확인해주세요');
      return;
    }
    const entry = {
      id: newId(),
      type: currentType,
      date: dateInput.value || todayStr(),
      category: categorySelect.value,
      amount: amount,
      memo: el('f-memo').value.trim()
    };
    if (currentType === 'expense' && el('f-card').value) entry.cardId = el('f-card').value;
    if (el('f-fixed').checked) entry.fixed = true;
    if (pendingBlob) {
      try {
        await putReceipt(entry.id, pendingBlob);
        entry.receipt = true;
      } catch (err) {
        showToast('사진을 저장하지 못했어요. 기록은 사진 없이 저장해요');
      }
    }
    transactions.push(entry);
    save();
    clearReceipt();
    dateTouched = false;
    el('f-fixed').checked = false;
    el('f-amount').value = '';
    el('f-memo').value = '';
    viewDate = new Date(entry.date);
    viewDate.setDate(1);
    renderAll();
    showToast('기록되었어요');
  });

  el('prev-month').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() - 1);
    renderAll();
  });
  el('next-month').addEventListener('click', () => {
    viewDate.setMonth(viewDate.getMonth() + 1);
    renderAll();
  });

  function monthKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }

  function txMonthKey(tx) {
    return tx.date.slice(0, 7);
  }

  function renderAll() {
    const key = monthKey(viewDate);
    el('month-label').textContent = viewDate.getFullYear() + '년 ' + (viewDate.getMonth() + 1) + '월';

    const monthTx = transactions.filter((t) => txMonthKey(t) === key);
    const income = monthTx.filter((t) => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const expense = monthTx.filter((t) => t.type === 'expense').reduce((s, t) => s + t.amount, 0);

    el('sum-income').textContent = formatWon(income);
    el('sum-expense').textContent = formatWon(expense);
    el('sum-balance').textContent = formatWon(income - expense);

    renderWeeks(monthTx.filter((t) => t.type === 'expense'));
    renderBreakdown(monthTx.filter((t) => t.type === 'expense'));
    renderCards(monthTx);
    renderFixed(monthTx);
    renderList(onlyFixed ? monthTx.filter(isFixed) : monthTx);
  }

  // 월 목표를 일요일 시작 주 단위로 나눈다. 1일이 주 중간이면 첫 주는 짧은 주이고, 목표는 일수에 비례해 배분한다.
  function weeksOfMonth(year, month) {
    const days = new Date(year, month + 1, 0).getDate();
    const weeks = [];
    for (let d = 1; d <= days; d++) {
      if (d === 1 || new Date(year, month, d).getDay() === 0) weeks.push({ start: d, end: d });
      else weeks[weeks.length - 1].end = d;
    }
    let left = goal;
    weeks.forEach((w, i) => {
      w.budget = i === weeks.length - 1 ? left : Math.round(goal * (w.end - w.start + 1) / days);
      left -= w.budget;
    });
    return weeks;
  }

  function renderWeeks(expenseTx) {
    const wrap = el('week-list');
    el('goal-input').value = goal || '';
    if (!goal) {
      wrap.innerHTML = '';
      return;
    }
    const y = viewDate.getFullYear();
    const m = viewDate.getMonth();
    const pad = (n) => String(n).padStart(2, '0');
    const prefix = y + '-' + pad(m + 1) + '-';
    const today = todayStr();
    wrap.innerHTML = weeksOfMonth(y, m)
      .map((w, i) => {
        const from = prefix + pad(w.start);
        const to = prefix + pad(w.end);
        const spent = expenseTx.filter((t) => t.date >= from && t.date <= to).reduce((s, t) => s + t.amount, 0);
        const ratio = w.budget ? spent / w.budget : (spent ? 2 : 0);
        const left = w.budget - spent;
        const cls = ratio > 1 ? 'over' : ratio > 0.8 ? 'near' : '';
        const current = today >= from && today <= to;
        return `<div class="week${current ? ' current' : ''}">
          <div class="line"><span class="name">${i + 1}주차${current ? '<em>이번 주</em>' : ''}</span><span>${m + 1}/${w.start} ~ ${m + 1}/${w.end}</span></div>
          <div class="track"><div class="fill ${cls}" style="width:${Math.min(100, ratio * 100)}%"></div></div>
          <div class="line"><span>${formatWon(spent)} / ${formatWon(w.budget)}</span><span class="${left < 0 ? 'over-text' : ''}">${left >= 0 ? formatWon(left) + ' 남음' : formatWon(-left) + ' 초과'}</span></div>
        </div>`;
      })
      .join('');
  }

  el('goal-save').addEventListener('click', () => {
    goal = Math.max(0, parseInt(el('goal-input').value, 10) || 0);
    try {
      localStorage.setItem(GOAL_KEY, String(goal));
    } catch (e) {
      showToast('저장 공간이 부족해 저장하지 못했어요');
      return;
    }
    renderAll();
    showToast(goal ? '월 목표를 저장했어요' : '월 목표를 해제했어요');
  });

  function renderBreakdown(expenseTx) {
    const wrap = el('breakdown-list');
    if (expenseTx.length === 0) {
      wrap.innerHTML = '<div class="empty-msg">이번 달 지출 내역이 없어요</div>';
      return;
    }
    const totals = {};
    expenseTx.forEach((t) => {
      totals[t.category] = (totals[t.category] || 0) + t.amount;
    });
    const max = Math.max(...Object.values(totals));
    const rows = Object.entries(totals)
      .sort((a, b) => b[1] - a[1])
      .map(([cat, amt]) => {
        const pct = Math.max(4, Math.round((amt / max) * 100));
        return `<div class="bar-row">
          <div class="cat-name">${cat}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="cat-amt">${formatWon(amt)}</div>
        </div>`;
      })
      .join('');
    wrap.innerHTML = rows;
  }

  function renderList(monthTx) {
    const wrap = el('tx-list');
    if (monthTx.length === 0) {
      wrap.innerHTML = '<div class="empty-msg">이번 달 기록이 없어요</div>';
      return;
    }
    const sorted = [...monthTx].sort((a, b) => (a.date < b.date ? 1 : -1));
    wrap.innerHTML = sorted
      .map((t) => {
        const sign = t.type === 'income' ? '+' : '-';
        const day = t.date.slice(5).replace('-', '/');
        return `<div class="tx-item" data-id="${t.id}">
          <div class="tx-main">
            <div class="tx-cat">${t.category}${t.memo ? ' · ' + escapeHtml(t.memo) : ''}</div>
            <div class="tx-meta">${day}${cardName(t) ? ' · ' + escapeHtml(cardName(t)) : ''}${t.recurId ? ' · 자동' : ''}${isFixed(t) ? ' · 고정' : ''}</div>
          </div>
          <div class="tx-amt ${t.type}">${sign}${formatWon(t.amount)}</div>
          <div class="tx-actions">
            <button class="fix-btn${isFixed(t) ? ' on' : ''}" title="고정 표시" aria-label="고정 표시">📌</button>
            ${t.receipt ? '<button class="rc-btn" title="영수증 보기" aria-label="영수증 보기">📷</button>' : ''}
            <button class="del-btn" title="삭제" aria-label="삭제">🗑</button>
          </div>
        </div>`;
      })
      .join('');

    wrap.querySelectorAll('.fix-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        const t = transactions.find((x) => x.id === e.target.closest('.tx-item').dataset.id);
        if (!t) return;
        t.fixed = !isFixed(t);
        save();
        renderAll();
        showToast(t.fixed ? '고정으로 표시했어요' : '고정 표시를 뺐어요');
      });
    });

    wrap.querySelectorAll('.rc-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => showReceipt(e.target.closest('.tx-item').dataset.id));
    });

    wrap.querySelectorAll('.del-btn').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        const item = e.target.closest('.tx-item');
        const id = item.dataset.id;
        transactions = transactions.filter((t) => t.id !== id);
        delReceipt(id).catch(() => {});
        tomb(id);
        save();
        renderAll();
        showToast('삭제되었어요');
      });
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  let toastTimer;
  function showToast(msg) {
    const t = el('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  el('export-btn').addEventListener('click', () => {
    // 예전 백업은 내역 배열만 있었다. 지금은 카드·자동이체·월 목표까지 한 파일에 담고, 불러올 때 두 형식을 모두 받는다.
    const backup = { app: 'dadari', version: 2, transactions, categories, cards, recurs, recurDone: [...recurDone], goal, schedule, health };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = todayStr();
    a.href = url;
    a.download = `다다리가계부_백업_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('백업 파일을 내려받았어요');
  });

  el('import-input').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        // 객체 형식은 일부 항목만 담아도 된다(예: 시간표만 있는 파일).
        const txs = Array.isArray(data) ? data : data && typeof data === 'object' ? data.transactions || [] : null;
        if (!Array.isArray(txs)) throw new Error('invalid format');
        const valid = txs.filter(
          (t) => t && t.id && t.date && t.category && typeof t.amount === 'number' && (t.type === 'income' || t.type === 'expense')
        );
        const existingIds = new Set(transactions.map((t) => t.id));
        const added = valid.filter((t) => !existingIds.has(t.id));
        transactions = transactions.concat(added);
        save();
        if (!Array.isArray(data)) {
          const mergeById = (target, incoming, ok) => {
            const ids = new Set(target.map((x) => x.id));
            (Array.isArray(incoming) ? incoming : []).filter((x) => x && x.id && ok(x) && !ids.has(x.id)).forEach((x) => target.push(x));
          };
          mergeById(cards, data.cards, (c) => typeof c.name === 'string');
          mergeById(recurs, data.recurs, (r) => typeof r.name === 'string' && r.amount > 0 && r.day >= 1 && r.day <= 31);
          (Array.isArray(data.recurDone) ? data.recurDone : []).forEach((k) => recurDone.add(k));
          saveJson(CARDS_KEY, cards);
          saveJson(RECURS_KEY, recurs);
          saveJson(DONE_KEY, [...recurDone]);
          if (!goal && data.goal > 0) {
            goal = Math.round(data.goal);
            saveJson(GOAL_KEY, goal);
          }
          renderCardOptions();
          if (data.categories && typeof data.categories === 'object') {
            ['expense', 'income'].forEach((k) => {
              (Array.isArray(data.categories[k]) ? data.categories[k] : []).forEach((n) => {
                if (typeof n === 'string' && n.trim() && !categories[k].includes(n)) categories[k].push(n);
              });
            });
            saveJson(CAT_KEY, categories);
            renderCategoryOptions();
          }
          if (data.health && typeof data.health === 'object') {
            const h = normalizeHealth(data.health);
            mergeById(health.visits, h.visits, (v) => validDate(v.date) && typeof v.hospital === 'string');
            mergeById(health.periods, h.periods, (p) => validDate(p.start));
            saveHealth();
            renderHealth();
          }
          if (data.schedule && typeof data.schedule === 'object') {
            mergeById(schedule.members, data.schedule.members, (m) => typeof m.name === 'string');
            const mids = new Set(schedule.members.map((m) => m.id));
            mergeById(schedule.items, data.schedule.items, (i) => mids.has(i.memberId) && typeof i.title === 'string'
              && /^\d{2}:\d{2}$/.test(i.time) && Number.isInteger(i.day) && i.day >= 0 && i.day <= 6);
            saveSchedule();
            renderSchedule();
          }
        }
        renderAll();
        showToast(added.length || Array.isArray(data) ? `${added.length}건을 새로 불러왔어요` : '불러왔어요');
      } catch (err) {
        showToast('올바른 백업 파일이 아니에요');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  /* ---------- 카드 · 자동이체 ---------- */
  // 카드는 이름·종류·결제일만 저장한다. 카드번호 등 민감한 정보는 입력받지 않는다.
  const pad2 = (n) => String(n).padStart(2, '0');
  const cardById = (id) => cards.find((c) => c.id === id);
  function cardName(t) {
    const c = t.cardId && cardById(t.cardId);
    return c ? c.name : '';
  }

  function renderCardOptions() {
    const sel = el('f-card');
    const prev = sel.value;
    sel.innerHTML = '<option value="">현금 · 계좌이체</option>' + cards
      .map((c) => `<option value="${c.id}">${escapeHtml(c.name)} (${c.kind === 'credit' ? '신용' : '체크'})</option>`)
      .join('');
    sel.value = cards.some((c) => c.id === prev) ? prev : '';
  }

  function updatePayVisibility() {
    el('pay-wrap').hidden = currentType !== 'expense';
    el('fixed-label').textContent = currentType === 'expense'
      ? ' 고정비 (월세·통신비처럼 매달 나가는 돈)'
      : ' 고정수입 (월급처럼 매달 들어오는 돈)';
  }

  // 고정 항목: 직접 체크한 수입·지출. 체크한 적 없는 자동 기록 내역은 고정으로 본다.
  const isFixed = (t) => (t.fixed === undefined ? !!t.recurId : t.fixed);

  function renderFixed(monthTx) {
    const fixed = monthTx.filter(isFixed).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const inc = fixed.filter((t) => t.type === 'income');
    const exp = fixed.filter((t) => t.type === 'expense');
    const sum = (l) => l.reduce((s, t) => s + t.amount, 0);
    const spent = monthTx.filter((t) => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const row = (t) => `<div class="fx-row">
        <span>${t.date.slice(5).replace('-', '/')} <em>${escapeHtml(t.memo || t.category)}</em>${cardName(t) ? ' · ' + escapeHtml(cardName(t)) : ''}</span>
        <b class="${t.type}">${t.type === 'income' ? '+' : '-'}${formatWon(t.amount)}</b></div>`;
    el('fixed-sum').textContent = fixed.length ? `수입 ${formatWon(sum(inc))} · 지출 ${formatWon(sum(exp))}` : '';
    if (!fixed.length) {
      el('fixed-list').innerHTML = '<div class="empty-msg">고정으로 표시한 수입·지출이 없어요<br>기록할 때 “고정”에 체크하거나, 내역의 📌를 눌러 표시하세요</div>';
      return;
    }
    const group = (title, list, extra) => list.length
      ? `<div class="fx-group"><span>${title}</span><span>${extra}</span></div>${list.map(row).join('')}`
      : '';
    const net = sum(inc) - sum(exp);
    el('fixed-list').innerHTML =
      group('고정수입', inc, `<b class="income">+${formatWon(sum(inc))}</b>`)
      + group('고정비', exp, `<b class="expense">-${formatWon(sum(exp))}</b> · 지출의 ${spent ? Math.round((sum(exp) / spent) * 100) : 0}%`)
      + (inc.length && exp.length
        ? `<div class="fx-group"><span>고정수입 − 고정비</span><span><b class="${net >= 0 ? 'income' : 'expense'}">${net < 0 ? '-' : ''}${formatWon(Math.abs(net))}</b></span></div>`
        : '');
  }

  el('only-fixed').addEventListener('change', (e) => {
    onlyFixed = e.target.checked;
    renderAll();
  });

  function recRows(list) {
    return list.map((r) => `<div class="rec">
        <div><div class="rec-name">${escapeHtml(r.name)}</div>
        <div class="rec-sub">매월 ${r.day}일 · ${escapeHtml(r.category)}${r.auto ? ' · 자동 기록' : ' · 기록 안 함'}</div></div>
        <div class="rec-amt${r.type === 'income' ? ' inc' : ''}">${r.type === 'income' ? '+' : ''}${formatWon(r.amount)}</div>
        <button type="button" class="icon-btn" data-del-recur="${r.id}" aria-label="자동이체 삭제">✕</button>
      </div>`).join('');
  }

  function renderCards(monthTx) {
    const wrap = el('cards-list');
    if (!cards.length && !recurs.length) {
      wrap.innerHTML = '<div class="empty-msg">등록한 카드가 없어요<br>카드 이름만 등록하면 돼요 (카드번호는 입력하지 않아요)</div>';
      return;
    }
    const spend = {};
    monthTx.filter((t) => t.type === 'expense' && t.cardId).forEach((t) => {
      spend[t.cardId] = (spend[t.cardId] || 0) + t.amount;
    });
    const sum = (list) => list.reduce((s, r) => s + r.amount, 0);

    const boxes = cards.map((c) => {
      const mine = recurs.filter((r) => r.cardId === c.id);
      const parts = [];
      if (c.kind === 'credit' && c.payDay) parts.push(`매월 ${c.payDay}일 결제`);
      parts.push(`이번 달 사용 ${formatWon(spend[c.id] || 0)}`);
      if (mine.length) parts.push(`자동이체 월 ${formatWon(sum(mine))}`);
      return `<div class="cardbox">
        <div class="cardhead">
          <div><b>${escapeHtml(c.name)}</b><span class="tag">${c.kind === 'credit' ? '신용' : '체크'}</span>
          <div class="cardsub">${parts.join(' · ')}</div></div>
          <button type="button" class="icon-btn" data-del-card="${c.id}" aria-label="카드 삭제">🗑</button>
        </div>${recRows(mine)}</div>`;
    });
    const acct = recurs.filter((r) => !r.cardId || !cardById(r.cardId));
    if (acct.length) {
      boxes.push(`<div class="cardbox">
        <div class="cardhead"><div><b>계좌 자동이체 · 고정수입</b>
        <div class="cardsub">카드 없이 통장으로 오가는 항목 · 월 지출 ${formatWon(sum(acct.filter((r) => r.type !== 'income')))}${acct.some((r) => r.type === 'income') ? ` · 월 수입 ${formatWon(sum(acct.filter((r) => r.type === 'income')))}` : ''}</div></div></div>${recRows(acct)}</div>`);
    }
    wrap.innerHTML = boxes.join('');
  }

  const sheet = el('sheet');
  const sheetBody = el('sheet-body');
  function closeSheet() {
    sheet.hidden = true;
    sheetBody.innerHTML = '';
    sheetBody.onclick = null;
    sheetBody.onsubmit = null;
  }
  function openSheet(html, onSubmit) {
    sheetBody.innerHTML = html;
    sheet.hidden = false;
    const f = sheetBody.querySelector('form');
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      if (onSubmit(new FormData(f)) !== false) closeSheet();
    });
    sheetBody.querySelector('[data-cancel]').addEventListener('click', closeSheet);
  }
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });

  const attr = (s) => escapeHtml(s).replace(/"/g, '&quot;');
  const catOptions = (kind) => categories[kind].map((c) => `<option value="${attr(c)}">${escapeHtml(c)}</option>`).join('');

  // 카테고리 관리: 이름을 바꾸면 기존 내역의 카테고리도 같이 바뀌고, 목록에서 빼도 기존 내역은 그 이름으로 남는다.
  function openCatSheet(kind) {
    const persist = () => {
      saveJson(CAT_KEY, categories);
      renderCategoryOptions();
    };
    const draw = () => {
      sheetBody.innerHTML = `<form>
        <h3>카테고리 관리</h3>
        <div class="sch-modes">
          <button type="button" data-kind="expense" class="${kind === 'expense' ? 'active' : ''}">지출</button>
          <button type="button" data-kind="income" class="${kind === 'income' ? 'active' : ''}">수입</button>
        </div>
        ${categories[kind].map((c, i) => `<div class="rec"><div class="rec-name">${escapeHtml(c)}</div>
          <button type="button" class="icon-btn" data-ren="${i}" aria-label="이름 바꾸기">✎</button>
          <button type="button" class="icon-btn" data-rm="${i}" aria-label="삭제">🗑</button></div>`).join('')}
        <label>새 카테고리</label>
        <div class="goal-row"><input id="cat-new" maxlength="12" placeholder="이름 입력" autocomplete="off"><button type="button" data-add>추가</button></div>
        <div class="sheet-actions"><button type="button" data-cancel>닫기</button></div>
      </form>`;
    };
    const add = () => {
      const name = sheetBody.querySelector('#cat-new').value.trim();
      if (!name) return;
      if (categories[kind].includes(name)) { showToast('이미 있는 이름이에요'); return; }
      categories[kind].push(name);
      persist();
      draw();
      showToast('추가했어요');
    };
    const rename = (i) => {
      const old = categories[kind][i];
      const name = (prompt('새 이름을 입력하세요\n(기존 내역의 카테고리도 함께 바뀌어요)', old) || '').trim();
      if (!name || name === old) return;
      if (categories[kind].includes(name)) { showToast('이미 있는 이름이에요'); return; }
      categories[kind][i] = name;
      transactions.forEach((t) => { if (t.type === kind && t.category === old) t.category = name; });
      recurs.forEach((r) => { if ((r.type || 'expense') === kind && r.category === old) r.category = name; });
      save();
      saveJson(RECURS_KEY, recurs);
      persist();
      renderAll();
      draw();
      showToast('이름을 바꿨어요');
    };
    const remove = (i) => {
      if (categories[kind].length <= 1) { showToast('카테고리는 하나 이상 있어야 해요'); return; }
      const name = categories[kind][i];
      if (!confirm(`“${name}” 카테고리를 목록에서 뺄까요?\n이미 기록한 내역은 그대로 남아요.`)) return;
      categories[kind].splice(i, 1);
      persist();
      draw();
      showToast('뺐어요');
    };
    sheetBody.onsubmit = (e) => { e.preventDefault(); add(); };
    sheetBody.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.kind) { kind = b.dataset.kind; draw(); }
      else if (b.dataset.add !== undefined) add();
      else if (b.dataset.cancel !== undefined) closeSheet();
      else if (b.dataset.ren !== undefined) rename(+b.dataset.ren);
      else if (b.dataset.rm !== undefined) remove(+b.dataset.rm);
    };
    draw();
    sheet.hidden = false;
  }
  el('cat-manage-btn').addEventListener('click', () => openCatSheet(currentType));

  el('add-card-btn').addEventListener('click', () => {
    openSheet(`<form>
      <h3>카드 등록</h3>
      <label>카드 이름</label>
      <input name="name" required maxlength="20" placeholder="예: 삼성카드, 국민 체크">
      <label>종류</label>
      <select name="kind"><option value="credit">신용카드</option><option value="debit">체크카드</option></select>
      <label>결제일 (신용카드만, 선택)</label>
      <input name="payDay" type="number" min="1" max="31" inputmode="numeric" placeholder="매월 며칠">
      <p class="goal-hint">카드번호는 입력하지 않아요. 이름으로만 구분해요.</p>
      <div class="sheet-actions"><button type="button" data-cancel>취소</button><button type="submit">등록</button></div>
    </form>`, (fd) => {
      const name = String(fd.get('name')).trim();
      if (!name) return false;
      const kind = fd.get('kind') === 'debit' ? 'debit' : 'credit';
      const day = parseInt(fd.get('payDay'), 10);
      cards.push({ id: newId(), name, kind, payDay: kind === 'credit' && day >= 1 && day <= 31 ? day : 0 });
      saveJson(CARDS_KEY, cards);
      renderCardOptions();
      renderAll();
      showToast('카드를 등록했어요');
    });
  });

  el('add-recur-btn').addEventListener('click', () => {
    const cardOpts = cards.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')
      + '<option value="">카드 없이 (계좌 자동이체)</option>';
    const catOpts = catOptions('expense');
    openSheet(`<form>
      <h3>자동이체 · 고정수입 등록</h3>
      <label>종류</label>
      <select name="kind"><option value="expense">지출 (자동이체·정기결제)</option><option value="income">수입 (월급 등 고정수입)</option></select>
      <label>결제 카드 (지출만)</label>
      <select name="card">${cardOpts}</select>
      <label>항목 이름</label>
      <input name="name" required maxlength="30" placeholder="예: 통신비, 넷플릭스">
      <label>금액 (원)</label>
      <input name="amount" type="number" min="1" inputmode="numeric" required>
      <label>매월 결제일</label>
      <input name="day" type="number" min="1" max="31" inputmode="numeric" required placeholder="1~31 (없는 날은 그 달 말일)">
      <label>카테고리</label>
      <select name="category">${catOpts}</select>
      <label>기록 시작일</label>
      <input name="start" type="date" value="${todayStr()}">
      <label class="check"><input type="checkbox" name="auto" checked> 결제일이 되면 내역에 자동으로 기록</label>
      <p class="goal-hint">시작일 이후의 결제일부터 기록돼요. 이미 직접 기록한 달은 시작일을 다음 달로 잡으면 중복되지 않아요.</p>
      <div class="sheet-actions"><button type="button" data-cancel>취소</button><button type="submit">등록</button></div>
    </form>`, (fd) => {
      const name = String(fd.get('name')).trim();
      const amount = parseInt(fd.get('amount'), 10);
      const day = parseInt(fd.get('day'), 10);
      const start = /^\d{4}-\d{2}-\d{2}$/.test(fd.get('start')) ? String(fd.get('start')) : todayStr();
      if (!name || !(amount > 0) || !(day >= 1 && day <= 31)) {
        showToast('항목 이름, 금액, 결제일을 확인해 주세요');
        return false;
      }
      recurs.push({
        id: newId(),
        type: fd.get('kind') === 'income' ? 'income' : 'expense',
        cardId: fd.get('kind') === 'income' ? null : fd.get('card') || null,
        name,
        amount,
        day,
        category: String(fd.get('category')),
        auto: fd.get('auto') === 'on',
        start
      });
      saveJson(RECURS_KEY, recurs);
      applyRecurs();
      renderAll();
      showToast('등록했어요');
    });
    // 수입을 고르면 카드 선택을 끄고 카테고리를 수입 목록으로 바꾼다.
    const kindSel = sheetBody.querySelector('[name=kind]');
    kindSel.addEventListener('change', () => {
      const income = kindSel.value === 'income';
      sheetBody.querySelector('[name=card]').disabled = income;
      sheetBody.querySelector('[name=category]').innerHTML = catOptions(income ? 'income' : 'expense');
    });
  });

  el('cards-list').addEventListener('click', (e) => {
    const delCard = e.target.closest('[data-del-card]');
    const delRecur = e.target.closest('[data-del-recur]');
    if (delCard) {
      const c = cardById(delCard.dataset.delCard);
      if (!c || !confirm(`“${c.name}” 카드를 삭제할까요?\n이 카드의 자동이체 등록도 함께 지워져요. 기존 내역은 남고 결제수단 표시만 사라져요.`)) return;
      tomb(c.id, ...recurs.filter((r) => r.cardId === c.id).map((r) => r.id));
      cards = cards.filter((x) => x.id !== c.id);
      recurs = recurs.filter((r) => r.cardId !== c.id);
      transactions.forEach((t) => { if (t.cardId === c.id) delete t.cardId; });
      save();
      saveJson(CARDS_KEY, cards);
      saveJson(RECURS_KEY, recurs);
      renderCardOptions();
      renderAll();
      showToast('카드를 삭제했어요');
    } else if (delRecur) {
      const r = recurs.find((x) => x.id === delRecur.dataset.delRecur);
      if (!r || !confirm(`“${r.name}” 자동이체를 삭제할까요?\n이미 기록된 내역은 그대로 남아요.`)) return;
      tomb(r.id);
      recurs = recurs.filter((x) => x.id !== r.id);
      saveJson(RECURS_KEY, recurs);
      renderAll();
      showToast('자동이체를 삭제했어요');
    }
  });

  // 결제일이 지난 자동 기록 항목을 내역에 만든다. 같은 달 항목은 한 번만 만들고, 지운 뒤에도 다시 만들지 않는다.
  function applyRecurs() {
    const today = todayStr();
    const now = new Date();
    let changed = false;
    recurs.forEach((r) => {
      if (!r.auto || !r.start) return;
      let [y, m] = r.start.split('-').map(Number);
      m -= 1;
      while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())) {
        const last = new Date(y, m + 1, 0).getDate();
        const date = y + '-' + pad2(m + 1) + '-' + pad2(Math.min(r.day, last));
        const key = r.id + ':' + date.slice(0, 7);
        if (date >= r.start && date <= today && !recurDone.has(key)) {
          // 기기마다 같은 달 항목을 따로 만들어도 동기화할 때 하나로 합쳐지도록 id를 고정한다.
          const entry = { id: 'rc_' + r.id + '_' + date.slice(0, 7), type: r.type === 'income' ? 'income' : 'expense', date, category: r.category, amount: r.amount, memo: r.name, recurId: r.id };
          if (r.cardId) entry.cardId = r.cardId;
          transactions.push(entry);
          recurDone.add(key);
          changed = true;
        }
        m += 1;
        if (m > 11) { m = 0; y += 1; }
      }
    });
    if (changed) {
      save();
      saveJson(DONE_KEY, [...recurDone]);
    }
    return changed;
  }

  // 앱을 켜 둔 채 결제일이 지나는 경우도 있어서, 앱으로 돌아올 때마다 한 번 더 확인한다.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && applyRecurs()) renderAll();
  });

  /* ---------- 시간표 ---------- */
  // 구성원(아이 등)별 요일 일정. 폰 안에만 저장하고 코드에는 이름·일정을 넣지 않는다(저장소가 공개라서).
  const SCH_KEY = 'dadari_schedule_v1';
  const VIEW_KEY = 'dadari_view_v1';
  const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
  const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
  let schedule = loadJson(SCH_KEY, { members: [], items: [] }); // members {id, name}, items {id, memberId, day(0=일), time 'HH:MM', title, note}
  let schDay = new Date().getDay();
  let schMode = 'day';
  let schMember = null;

  const fmtTime = (t) => {
    const [h, m] = t.split(':').map(Number);
    return (h < 12 ? '오전 ' : '오후 ') + (h % 12 || 12) + ':' + pad2(m);
  };
  const byTime = (a, b) => (a.time < b.time ? -1 : a.time > b.time ? 1 : a.title.localeCompare(b.title));
  const saveSchedule = () => saveJson(SCH_KEY, schedule);

  function setView(v) {
    el('view-ledger').hidden = v !== 'ledger';
    el('view-schedule').hidden = v !== 'schedule';
    el('view-health').hidden = v !== 'health';
    document.querySelectorAll('#viewtabs button').forEach((b) => b.classList.toggle('active', b.dataset.view === v));
    saveJson(VIEW_KEY, v);
    if (v === 'schedule') renderSchedule();
    if (v === 'health') renderHealth();
  }
  el('viewtabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-view]');
    if (b) setView(b.dataset.view);
  });

  function itemButton(i, now) {
    return `<button type="button" class="sch-item${now ? ' now' : ''}" data-item="${i.id}">
      <span class="sch-time">${fmtTime(i.time)}</span>
      <span class="sch-title">${escapeHtml(i.title)}${now ? '<span class="sch-tag">지금</span>' : ''}${i.note ? `<span class="sch-note">${escapeHtml(i.note)}</span>` : ''}</span>
    </button>`;
  }

  function renderSchedule() {
    const { members, items } = schedule;
    const today = new Date().getDay();
    el('sch-modes').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.mode === schMode));
    el('day-tabs').hidden = schMode !== 'day';
    el('member-chips').hidden = schMode !== 'week' || members.length < 2;
    el('add-sch-btn').disabled = !members.length;

    if (!members.length) {
      el('sch-body').innerHTML = '<div class="empty-msg">아직 구성원이 없어요<br>아래 “＋ 구성원 추가”로 이름을 넣고 일정을 추가해 보세요<br>(백업 파일로 시간표를 불러올 수도 있어요)</div>';
      return;
    }

    if (schMode === 'day') {
      el('day-tabs').innerHTML = DAY_ORDER.map((d) =>
        `<button type="button" data-day="${d}" class="${d === schDay ? 'active' : ''}${d === today ? ' today' : ''}">${DAYS[d]}</button>`).join('');
      const nowStr = pad2(new Date().getHours()) + ':' + pad2(new Date().getMinutes());
      el('sch-body').innerHTML = members.map((m) => {
        const list = items.filter((i) => i.memberId === m.id && i.day === schDay).sort(byTime);
        // 오늘이면 이미 시작한 마지막 일정을 "지금"으로 표시한다.
        const cur = schDay === today ? list.filter((i) => i.time <= nowStr).pop() : null;
        return `<div class="sch-member"><div class="sch-head"><b>${escapeHtml(m.name)}</b>
          <button type="button" class="icon-btn" data-del-member="${m.id}" aria-label="구성원 삭제">🗑</button></div>
          ${list.length ? list.map((i) => itemButton(i, cur && cur.id === i.id)).join('') : '<div class="empty-msg" style="padding:10px 0">이 요일 일정이 없어요</div>'}</div>`;
      }).join('');
      return;
    }

    if (!members.some((m) => m.id === schMember)) schMember = members[0].id;
    el('member-chips').innerHTML = members.map((m) =>
      `<button type="button" data-member="${m.id}" class="${m.id === schMember ? 'active' : ''}">${escapeHtml(m.name)}</button>`).join('');
    const mine = items.filter((i) => i.memberId === schMember);
    const days = DAY_ORDER.filter((d) => d !== 0 || mine.some((i) => i.day === 0));
    const times = [...new Set(mine.map((i) => i.time))].sort();
    if (!times.length) {
      el('sch-body').innerHTML = '<div class="empty-msg">등록된 일정이 없어요</div>';
      return;
    }
    const head = '<th>시간</th>' + days.map((d) => `<th class="${d === today ? 'today' : ''}">${DAYS[d]}</th>`).join('');
    const rows = times.map((t) => '<tr><td class="t">' + fmtTime(t) + '</td>' + days.map((d) => {
      const cell = mine.filter((i) => i.day === d && i.time === t);
      return '<td>' + cell.map((i) => `<button type="button" data-item="${i.id}">${escapeHtml(i.title)}${i.note ? '<br><small>' + escapeHtml(i.note) + '</small>' : ''}</button>`).join('<br>') + '</td>';
    }).join('') + '</tr>').join('');
    el('sch-body').innerHTML = `<div class="week-wrap"><table class="week"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  el('sch-modes').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]');
    if (b) { schMode = b.dataset.mode; renderSchedule(); }
  });
  el('day-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-day]');
    if (b) { schDay = +b.dataset.day; renderSchedule(); }
  });
  el('member-chips').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-member]');
    if (b) { schMember = b.dataset.member; renderSchedule(); }
  });

  el('add-member-btn').addEventListener('click', () => {
    openSheet(`<form>
      <h3>구성원 추가</h3>
      <label>이름</label>
      <input name="name" required maxlength="20" placeholder="예: 첫째, 나, 이름">
      <div class="sheet-actions"><button type="button" data-cancel>취소</button><button type="submit">추가</button></div>
    </form>`, (fd) => {
      const name = String(fd.get('name')).trim();
      if (!name) return false;
      schedule.members.push({ id: newId(), name });
      saveSchedule();
      renderSchedule();
      showToast('추가했어요');
    });
  });

  // item이 있으면 수정(요일 하나), 없으면 추가(요일 여러 개를 한 번에 고를 수 있다).
  function openItemSheet(item) {
    const memberOpts = schedule.members.map((m) =>
      `<option value="${m.id}"${(item ? item.memberId : schedule.members.some((x) => x.id === schMember) ? schMember : '') === m.id ? ' selected' : ''}>${escapeHtml(m.name)}</option>`).join('');
    const dayField = item
      ? `<select name="day">${DAY_ORDER.map((d) => `<option value="${d}"${d === item.day ? ' selected' : ''}>${DAYS[d]}요일</option>`).join('')}</select>`
      : `<div class="days-check">${DAY_ORDER.map((d) => `<label class="d"><input type="checkbox" name="days" value="${d}"${d === schDay ? ' checked' : ''}>${DAYS[d]}</label>`).join('')}</div>`;
    openSheet(`<form>
      <h3>${item ? '일정 수정' : '일정 추가'}</h3>
      <label>구성원</label>
      <select name="member">${memberOpts}</select>
      <label>${item ? '요일' : '요일 (여러 개 선택 가능)'}</label>
      ${dayField}
      <label>시작 시간</label>
      <input name="time" type="time" required value="${item ? item.time : ''}">
      <label>일정</label>
      <input name="title" required maxlength="30" placeholder="예: 영어, 수영, 하교" value="${item ? escapeHtml(item.title).replace(/"/g, '&quot;') : ''}">
      <label>메모 (장소 등, 선택)</label>
      <input name="note" maxlength="30" placeholder="예: 5층음악실" value="${item ? escapeHtml(item.note || '').replace(/"/g, '&quot;') : ''}">
      <div class="sheet-actions">
        <button type="button" data-cancel>취소</button>
        ${item ? '<button type="button" data-delete>삭제</button>' : ''}
        <button type="submit">${item ? '저장' : '추가'}</button>
      </div>
    </form>`, (fd) => {
      const title = String(fd.get('title')).trim();
      const time = String(fd.get('time'));
      if (!title || !/^\d{2}:\d{2}$/.test(time)) { showToast('일정 이름과 시간을 확인해 주세요'); return false; }
      const base = { memberId: String(fd.get('member')), time, title, note: String(fd.get('note')).trim() };
      if (item) {
        Object.assign(item, base, { day: +fd.get('day') });
      } else {
        const days = fd.getAll('days').map(Number);
        if (!days.length) { showToast('요일을 하나 이상 골라 주세요'); return false; }
        days.forEach((d) => schedule.items.push({ id: newId(), day: d, ...base }));
        schDay = days[0];
        schMember = base.memberId;
      }
      saveSchedule();
      renderSchedule();
      showToast(item ? '수정했어요' : '추가했어요');
    });
    const del = sheetBody.querySelector('[data-delete]');
    if (del) {
      del.addEventListener('click', () => {
        tomb(item.id);
        schedule.items = schedule.items.filter((i) => i.id !== item.id);
        saveSchedule();
        closeSheet();
        renderSchedule();
        showToast('삭제했어요');
      });
    }
  }
  el('add-sch-btn').addEventListener('click', () => openItemSheet(null));
  el('sch-body').addEventListener('click', (e) => {
    const it = e.target.closest('[data-item]');
    if (it) { openItemSheet(schedule.items.find((i) => i.id === it.dataset.item)); return; }
    const dm = e.target.closest('[data-del-member]');
    if (dm) {
      const m = schedule.members.find((x) => x.id === dm.dataset.delMember);
      if (!m || !confirm(`“${m.name}”을(를) 삭제할까요?\n등록한 시간표 일정도 함께 지워져요.`)) return;
      tomb(m.id, ...schedule.items.filter((i) => i.memberId === m.id).map((i) => i.id));
      schedule.members = schedule.members.filter((x) => x.id !== m.id);
      schedule.items = schedule.items.filter((i) => i.memberId !== m.id);
      saveSchedule();
      renderSchedule();
      showToast('삭제했어요');
    }
  });
  // 켜 둔 채 시간이 흘러도 "지금" 표시가 맞도록 1분마다 갱신한다.
  setInterval(() => { if (!el('view-schedule').hidden && schMode === 'day') renderSchedule(); }, 60000);

  /* ---------- 건강관리 (병원 · 생리주기) ---------- */
  // 건강 정보는 코드에 넣지 않고 이 기기와(연결했다면) 내 비공개 저장소에만 둔다.
  const HEALTH_KEY = 'dadari_health_v1';
  const normalizeHealth = (h) => ({
    visits: Array.isArray(h && h.visits) ? h.visits : [],
    periods: Array.isArray(h && h.periods) ? h.periods : []
  });
  let health = normalizeHealth(loadJson(HEALTH_KEY, null));
  let healthMode = 'visit';
  let healthWho = 'all';
  let cycleView = { y: new Date().getFullYear(), m: new Date().getMonth() };
  const saveHealth = () => saveJson(HEALTH_KEY, health);
  const people = () => [{ id: 'me', name: '나' }, ...schedule.members];
  const whoName = (id) => (people().find((p) => p.id === id) || { name: '(삭제된 구성원)' }).name;

  const parseD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const fmtD = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); };
  const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 86400000);
  const mdOf = (s) => +s.slice(5, 7) + '/' + +s.slice(8, 10);
  const validDate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

  function renderHealth() {
    el('health-modes').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.hm === healthMode));
    el('health-who').hidden = healthMode !== 'visit' || people().length < 2;
    el('health-actions').innerHTML = healthMode === 'visit'
      ? '<button type="button" class="mini-btn" data-act="add-visit">＋ 진료 기록</button>'
      : '<button type="button" class="mini-btn" data-act="add-period">＋ 생리 시작 기록</button>';
    if (healthMode === 'visit') renderVisits(); else renderCycle();
  }

  function renderVisits() {
    const ppl = people();
    if (healthWho !== 'all' && !ppl.some((p) => p.id === healthWho)) healthWho = 'all';
    el('health-who').innerHTML = [{ id: 'all', name: '전체' }, ...ppl]
      .map((p) => `<button type="button" data-who="${p.id}" class="${p.id === healthWho ? 'active' : ''}">${escapeHtml(p.name)}</button>`).join('');
    const list = health.visits.filter((v) => validDate(v.date) && (healthWho === 'all' || v.who === healthWho));
    const today = todayStr();
    const tag = (v) => (healthWho === 'all' && ppl.length > 1 ? `<span class="who-tag">${escapeHtml(whoName(v.who))}</span>` : '');
    const title = (v) => escapeHtml(v.hospital || '') + (v.dept ? ` (${escapeHtml(v.dept)})` : '') + tag(v);

    const upcoming = list.filter((v) => validDate(v.next) && v.next >= today).sort((a, b) => (a.next < b.next ? -1 : 1));
    const past = [...list].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    const year = today.slice(0, 4);
    const yearList = list.filter((v) => v.date.startsWith(year));
    const cost = yearList.reduce((s, v) => s + (+v.cost || 0), 0);

    let html = '';
    if (upcoming.length) {
      html += '<div class="h-sec">다음 예약</div>' + upcoming.map((v) => {
        const dd = diffDays(v.next, today);
        return `<button type="button" class="visit" data-visit="${v.id}"><div class="v1"><span>${mdOf(v.next)} · ${title(v)}</span><span class="dd">${dd === 0 ? '오늘' : 'D-' + dd}</span></div>
          ${v.reason ? `<div class="v2">${escapeHtml(v.reason)}</div>` : ''}</button>`;
      }).join('');
    }
    html += `<div class="h-sec">진료 기록${list.length ? ` · 올해 ${yearList.length}회${cost ? ' · ' + formatWon(cost) : ''}` : ''}</div>`;
    html += past.length ? past.map((v) => `<button type="button" class="visit" data-visit="${v.id}">
        <div class="v1"><span>${v.date.slice(2).replace(/-/g, '.')} · ${title(v)}</span><span>${+v.cost ? formatWon(+v.cost) : ''}</span></div>
        <div class="v2">${[v.reason, validDate(v.next) ? '다음 예약 ' + mdOf(v.next) : '', v.note].filter(Boolean).map(escapeHtml).join(' · ')}</div></button>`).join('')
      : '<div class="empty-msg">진료 기록이 없어요<br>아래 “＋ 진료 기록”으로 추가하세요</div>';
    el('health-body').innerHTML = html;
  }

  function openVisitSheet(v) {
    const who = v ? v.who : healthWho === 'all' ? 'me' : healthWho;
    const whoOpts = people().map((p) => `<option value="${attr(p.id)}"${p.id === who ? ' selected' : ''}>${escapeHtml(p.name)}</option>`).join('');
    const val = (x) => attr(x == null ? '' : String(x));
    openSheet(`<form>
      <h3>${v ? '진료 기록 수정' : '진료 기록 추가'}</h3>
      <label>누구</label><select name="who">${whoOpts}</select>
      <label>진료일</label><input name="date" type="date" required value="${v ? val(v.date) : todayStr()}">
      <label>병원</label><input name="hospital" required maxlength="30" placeholder="예: 우리소아과" value="${val(v && v.hospital)}">
      <label>진료과 (선택)</label><input name="dept" maxlength="20" placeholder="예: 소아과, 치과" value="${val(v && v.dept)}">
      <label>증상 · 진단 (선택)</label><input name="reason" maxlength="60" value="${val(v && v.reason)}">
      <label>진료비 (원, 선택)</label><input name="cost" type="number" min="0" inputmode="numeric" value="${val(v && v.cost)}">
      <label>다음 예약일 (선택)</label><input name="next" type="date" value="${val(v && v.next)}">
      <label>메모 (선택)</label><input name="note" maxlength="80" value="${val(v && v.note)}">
      ${v ? '' : '<label class="check"><input type="checkbox" name="ledger" checked> 진료비를 가계부에 지출로도 기록</label>'}
      <div class="sheet-actions"><button type="button" data-cancel>취소</button>${v ? '<button type="button" data-delete>삭제</button>' : ''}<button type="submit">저장</button></div>
    </form>`, (fd) => {
      const hospital = String(fd.get('hospital')).trim();
      const date = String(fd.get('date'));
      if (!hospital || !validDate(date)) { showToast('병원 이름과 진료일을 확인해 주세요'); return false; }
      const cost = Math.max(0, parseInt(fd.get('cost'), 10) || 0);
      const next = validDate(String(fd.get('next'))) ? String(fd.get('next')) : '';
      const rec = {
        who: String(fd.get('who')), date, hospital, dept: String(fd.get('dept')).trim(),
        reason: String(fd.get('reason')).trim(), cost, next, note: String(fd.get('note')).trim()
      };
      if (v) Object.assign(v, rec);
      else {
        health.visits.push({ id: newId(), ...rec });
        if (fd.get('ledger') === 'on' && cost > 0) {
          const cat = categories.expense.includes('의료/건강') ? '의료/건강' : categories.expense[0];
          transactions.push({ id: newId(), type: 'expense', date, category: cat, amount: cost, memo: hospital + ' 진료' });
          save();
          renderAll();
        }
      }
      saveHealth();
      renderHealth();
      showToast(v ? '수정했어요' : '추가했어요');
    });
    const del = sheetBody.querySelector('[data-delete]');
    if (del) {
      del.addEventListener('click', () => {
        tomb(v.id);
        health.visits = health.visits.filter((x) => x.id !== v.id);
        saveHealth();
        closeSheet();
        renderHealth();
        showToast('삭제했어요');
      });
    }
  }

  // 생리주기: 시작일 기록으로 평균 주기·기간을 계산해 다음 예정일을 추정한다. 참고용이다.
  function cycleStats() {
    const ps = health.periods.filter((p) => validDate(p.start)).sort((a, b) => (a.start < b.start ? -1 : a.start > b.start ? 1 : 0));
    const starts = ps.map((p) => p.start);
    const gaps = starts.slice(1).map((s, i) => diffDays(s, starts[i])).filter((g) => g >= 15 && g <= 60).slice(-6);
    const avg = (a, d) => (a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : d);
    const lens = ps.filter((p) => validDate(p.end)).map((p) => diffDays(p.end, p.start) + 1).filter((l) => l >= 1 && l <= 15).slice(-6);
    return { ps, cycle: avg(gaps, 28), len: avg(lens, 5), last: ps[ps.length - 1] || null, learned: gaps.length > 0 };
  }

  function renderCycle() {
    const { ps, cycle, len, last, learned } = cycleStats();
    const today = todayStr();
    const period = new Set(), pred = new Set(), fert = new Set(), ovul = new Set();
    const span = (set, s, n) => { for (let i = 0; i < n; i++) set.add(addDays(s, i)); };
    const endOf = (p) => (validDate(p.end) ? p.end : addDays(p.start, len - 1));
    ps.forEach((p) => span(period, p.start, Math.max(1, diffDays(endOf(p), p.start) + 1)));
    let next = null;
    if (last) {
      for (let k = 1; k <= 3; k++) {
        const s = addDays(last.start, cycle * k);
        if (k === 1) next = s;
        span(pred, s, len);
        const o = addDays(s, -14);
        ovul.add(o);
        span(fert, addDays(o, -5), 7);
      }
    }

    let sum;
    if (!last) {
      sum = '<div class="empty-msg">아직 기록이 없어요<br>생리가 시작된 날을 기록하면 주기를 계산해 드려요</div>';
    } else {
      const dd = diffDays(next, today);
      const ongoing = !validDate(last.end) && diffDays(today, last.start) >= 0 && diffDays(today, last.start) <= 14;
      sum = `<div class="cyc-sum">다음 생리 예정 <b>${mdOf(next)}</b> (${dd > 0 ? 'D-' + dd : dd === 0 ? '오늘' : -dd + '일 지남'})<br>
        이번 주기 배란 예정 ${mdOf(addDays(next, -14))} · 가임기 ${mdOf(addDays(next, -19))}~${mdOf(addDays(next, -13))} (추정)<br>
        평균 주기 ${cycle}일${learned ? '' : ' (기록이 쌓이면 계산해요)'} · 평균 기간 ${len}일
        ${ongoing ? '<br><button type="button" class="mini-btn" data-cyc-end style="margin-top:6px">오늘 생리 끝남으로 기록</button>' : ''}</div>`;
    }

    const { y, m } = cycleView;
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    let cells = DAYS.map((d) => `<div class="dow">${d}</div>`).join('') + '<div></div>'.repeat(first);
    for (let d = 1; d <= days; d++) {
      const key = y + '-' + pad2(m + 1) + '-' + pad2(d);
      const cls = [period.has(key) ? 'period' : pred.has(key) ? 'pred' : fert.has(key) ? 'fert' : '', ovul.has(key) ? 'ovul' : '', key === today ? 'today' : ''].filter(Boolean).join(' ');
      cells += `<button type="button" data-cd="${key}" class="${cls}">${d}</button>`;
    }

    const history = [...ps].reverse().map((p, i, arr) => {
      const prev = arr[i + 1];
      const gap = prev ? `${diffDays(p.start, prev.start)}일 주기` : '';
      const lenTxt = validDate(p.end) ? `${diffDays(p.end, p.start) + 1}일간` : '진행 중/종료일 없음';
      return `<button type="button" class="visit" data-period="${p.id}"><div class="v1"><span>${p.start}${validDate(p.end) ? ' ~ ' + p.end : ''}</span><span>${lenTxt}</span></div>
        <div class="v2">${[gap, p.note].filter(Boolean).map(escapeHtml).join(' · ')}</div></button>`;
    }).join('');

    el('health-body').innerHTML = `${sum}
      <div class="cyc-nav"><button type="button" data-cn="-1" aria-label="이전 달">‹</button><span>${y}년 ${m + 1}월</span><button type="button" data-cn="1" aria-label="다음 달">›</button></div>
      <div class="cyc-grid">${cells}</div>
      <div class="cyc-legend"><span><i style="background:var(--expense)"></i>생리</span><span><i style="border:1px dashed var(--expense)"></i>예정</span><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>가임기(추정)</span></div>
      <p class="cyc-note">날짜를 누르면 기록하거나 고칠 수 있어요. 예정일·가임기는 내 기록으로 계산한 추정값이라 참고용이에요(피임·진단 용도로 쓰지 마세요).</p>
      ${history ? `<div class="h-sec">기록</div>${history}` : ''}`;
  }

  function openPeriodSheet(p, presetStart) {
    const val = (x) => attr(x == null ? '' : String(x));
    openSheet(`<form>
      <h3>${p ? '생리 기록 수정' : '생리 기록 추가'}</h3>
      <label>시작일</label><input name="start" type="date" required value="${p ? val(p.start) : presetStart || todayStr()}">
      <label>종료일 (아직이면 비워 두세요)</label><input name="end" type="date" value="${val(p && p.end)}">
      <label>메모 (선택)</label><input name="note" maxlength="80" placeholder="예: 통증 심함" value="${val(p && p.note)}">
      <div class="sheet-actions"><button type="button" data-cancel>취소</button>${p ? '<button type="button" data-delete>삭제</button>' : ''}<button type="submit">저장</button></div>
    </form>`, (fd) => {
      const start = String(fd.get('start'));
      const end = validDate(String(fd.get('end'))) ? String(fd.get('end')) : '';
      if (!validDate(start) || (end && end < start)) { showToast('시작일과 종료일을 확인해 주세요'); return false; }
      const rec = { start, end, note: String(fd.get('note')).trim() };
      if (p) Object.assign(p, rec); else health.periods.push({ id: newId(), ...rec });
      saveHealth();
      cycleView = { y: +start.slice(0, 4), m: +start.slice(5, 7) - 1 };
      renderHealth();
      showToast(p ? '수정했어요' : '기록했어요');
    });
    const del = sheetBody.querySelector('[data-delete]');
    if (del) {
      del.addEventListener('click', () => {
        tomb(p.id);
        health.periods = health.periods.filter((x) => x.id !== p.id);
        saveHealth();
        closeSheet();
        renderHealth();
        showToast('삭제했어요');
      });
    }
  }

  el('health-modes').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-hm]');
    if (b) { healthMode = b.dataset.hm; renderHealth(); }
  });
  el('health-who').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-who]');
    if (b) { healthWho = b.dataset.who; renderHealth(); }
  });
  el('health-actions').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    if (b.dataset.act === 'add-visit') openVisitSheet(null); else openPeriodSheet(null);
  });
  el('health-body').addEventListener('click', (e) => {
    const visit = e.target.closest('[data-visit]');
    if (visit) { openVisitSheet(health.visits.find((v) => v.id === visit.dataset.visit)); return; }
    const per = e.target.closest('[data-period]');
    if (per) { openPeriodSheet(health.periods.find((p) => p.id === per.dataset.period)); return; }
    const nav = e.target.closest('[data-cn]');
    if (nav) {
      const d = new Date(cycleView.y, cycleView.m + +nav.dataset.cn, 1);
      cycleView = { y: d.getFullYear(), m: d.getMonth() };
      renderHealth();
      return;
    }
    if (e.target.closest('[data-cyc-end]')) {
      const { last } = cycleStats();
      if (last) { last.end = todayStr(); saveHealth(); renderHealth(); showToast('종료일을 기록했어요'); }
      return;
    }
    const cd = e.target.closest('[data-cd]');
    if (cd) {
      const { ps, len } = cycleStats();
      const key = cd.dataset.cd;
      const hit = ps.find((p) => key >= p.start && key <= (validDate(p.end) ? p.end : addDays(p.start, len - 1)));
      openPeriodSheet(hit || null, key);
    }
  });

  /* ---------- 동기화 (GitHub 비공개 저장소) ---------- */
  // 모든 데이터를 비공개 저장소의 파일 하나(dadari-data.json)에 모은다. 토큰은 이 기기에만 저장하고 백업에는 넣지 않는다.
  const GH_API = 'https://api.github.com';
  const b64enc = (str) => {
    let bin = '';
    new TextEncoder().encode(str).forEach((b) => { bin += String.fromCharCode(b); });
    return btoa(bin);
  };
  const b64dec = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), (c) => c.charCodeAt(0)));
  const getCfg = () => loadJson(SYNC_KEY, null);
  const setCfg = (cfg) => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); } catch (e) {} };
  const defaultCats = () => ({ expense: [...CATEGORIES.expense], income: [...CATEGORIES.income] });
  const sameCats = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const hasData = () => transactions.length || cards.length || recurs.length || schedule.members.length
    || health.visits.length || health.periods.length || goal > 0 || !sameCats(categories, defaultCats());

  function markDirty() {
    if (applying) return;
    const cfg = getCfg();
    if (!cfg || !cfg.token) return;
    cfg.dirty = true;
    cfg.seq = (cfg.seq || 0) + 1;
    setCfg(cfg);
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => syncNow(), 2000);
    showSync();
  }

  const snapshot = () => ({
    app: 'dadari', version: 3, updatedAt: new Date().toISOString(),
    transactions, categories, cards, recurs, recurDone: [...recurDone], goal, schedule, health, tombs: [...tombs]
  });

  // 두 기기가 따로 고친 내용을 합친다. 같은 id가 양쪽에 있으면 이 기기 것을 쓰고, 지운 항목(tombs)은 되살리지 않는다.
  function mergeSnapshots(local, remote) {
    const dead = new Set([...(local.tombs || []), ...(remote.tombs || [])]);
    const union = (l, r) => {
      const m = new Map();
      [r, l].forEach((list) => (Array.isArray(list) ? list : []).forEach((x) => { if (x && x.id) m.set(x.id, x); }));
      return [...m.values()].filter((x) => !dead.has(x.id));
    };
    const members = union(local.schedule && local.schedule.members, remote.schedule && remote.schedule.members);
    const ids = new Set(members.map((m) => m.id));
    const lh = local.health || {}, rh = remote.health || {};
    return {
      ...local,
      transactions: union(local.transactions, remote.transactions),
      cards: union(local.cards, remote.cards),
      recurs: union(local.recurs, remote.recurs),
      recurDone: [...new Set([...(local.recurDone || []), ...(remote.recurDone || [])])],
      schedule: { members, items: union(local.schedule && local.schedule.items, remote.schedule && remote.schedule.items).filter((i) => ids.has(i.memberId)) },
      health: { visits: union(lh.visits, rh.visits), periods: union(lh.periods, rh.periods) },
      categories: remote.categories && sameCats(local.categories, defaultCats()) ? remote.categories : local.categories,
      goal: local.goal || remote.goal || 0,
      tombs: [...dead]
    };
  }

  function applySnapshot(s) {
    applying = true;
    try {
      if (Array.isArray(s.transactions)) transactions = s.transactions;
      if (Array.isArray(s.cards)) cards = s.cards;
      if (Array.isArray(s.recurs)) recurs = s.recurs;
      if (Array.isArray(s.recurDone)) recurDone = new Set(s.recurDone);
      if (s.goal !== undefined) goal = Math.max(0, parseInt(s.goal, 10) || 0);
      if (s.schedule) schedule = { members: s.schedule.members || [], items: s.schedule.items || [] };
      if (s.health) health = normalizeHealth(s.health);
      if (s.categories) { saveJson(CAT_KEY, s.categories); categories = loadCategories(); }
      if (Array.isArray(s.tombs)) tombs = new Set([...tombs, ...s.tombs]);
      save();
      saveJson(CARDS_KEY, cards);
      saveJson(RECURS_KEY, recurs);
      saveJson(DONE_KEY, [...recurDone]);
      saveJson(GOAL_KEY, goal);
      saveJson(TOMB_KEY, [...tombs]);
      saveSchedule();
      saveHealth();
    } finally {
      applying = false;
    }
    renderCardOptions();
    renderCategoryOptions();
    renderAll();
    renderSchedule();
    renderHealth();
    if (applyRecurs()) renderAll();
  }

  function httpError(r) {
    if (r.status === 401) return new Error('토큰이 올바르지 않아요');
    if (r.status === 403) return new Error('토큰 권한이 부족해요 (Contents 읽기·쓰기 필요)');
    return new Error('서버 응답 오류 ' + r.status);
  }
  const ghFetch = (cfg, method, path, body) => fetch((cfg.api || GH_API) + path, {
    method,
    headers: Object.assign({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined,
    cache: 'no-store'
  });

  async function ghGetFile(cfg) {
    const r = await ghFetch(cfg, 'GET', `/repos/${cfg.repo}/contents/${SYNC_PATH}`);
    if (r.status === 404) {
      const repo = await ghFetch(cfg, 'GET', `/repos/${cfg.repo}`);
      if (repo.status === 404) throw new Error('저장소를 찾을 수 없어요. 이름과 토큰 권한을 확인해 주세요');
      if (!repo.ok) throw httpError(repo);
      return null;
    }
    if (!r.ok) throw httpError(r);
    const j = await r.json();
    if (typeof j.content !== 'string' || !j.content) throw new Error('데이터 파일을 읽지 못했어요(크기 초과일 수 있어요)');
    return { sha: j.sha, data: JSON.parse(b64dec(j.content)) };
  }

  async function ghPutFile(cfg, obj, sha) {
    const body = { message: 'dadari sync', content: b64enc(JSON.stringify(obj)) };
    if (sha) body.sha = sha;
    const r = await ghFetch(cfg, 'PUT', `/repos/${cfg.repo}/contents/${SYNC_PATH}`, body);
    if (r.status === 409 || r.status === 422) return { conflict: true };
    if (!r.ok) throw httpError(r);
    return { sha: (await r.json()).content.sha };
  }

  function showSync(text) {
    const cfg = getCfg();
    let msg;
    if (text) msg = text;
    else if (!cfg || !cfg.token) msg = '연결 안 됨 · 연결하면 폰과 컴퓨터에서 같은 데이터를 쓸 수 있어요';
    else {
      const t = cfg.last ? new Date(cfg.last).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '아직 안 함';
      msg = `${cfg.repo} · ` + (cfg.error ? '⚠ ' + cfg.error : '마지막 동기화 ' + t) + (cfg.dirty ? ' · 보낼 변경 있음' : '');
    }
    el('sync-status').textContent = msg;
  }

  async function syncNow(manual) {
    const cfg0 = getCfg();
    if (!cfg0 || !cfg0.token || !cfg0.repo) {
      if (manual) openSyncSheet();
      return;
    }
    if (syncing) { syncAgain = true; return; }
    syncing = true;
    showSync('동기화 중…');
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        const cfg = getCfg();
        const seq0 = cfg.seq || 0;
        const remote = await ghGetFile(cfg);
        let out;
        let sha = remote && remote.sha;
        if (!remote) out = snapshot();
        else if (remote.sha === cfg.sha && !cfg.dirty) { out = null; }
        else if (remote.sha === cfg.sha) out = snapshot();
        else if (!cfg.dirty) { applySnapshot(remote.data); out = null; }
        else { out = mergeSnapshots(snapshot(), remote.data); applySnapshot(out); }
        if (out) {
          const res = await ghPutFile(cfg, out, sha);
          if (res.conflict) continue;
          sha = res.sha;
        }
        const cur = getCfg();
        cur.sha = sha;
        cur.dirty = (cur.seq || 0) !== seq0 ? true : false;
        cur.last = Date.now();
        cur.error = '';
        setCfg(cur);
        return;
      }
      throw new Error('다른 기기와 동시에 저장돼 충돌했어요. 잠시 뒤 다시 시도해 주세요');
    } catch (e) {
      const cur = getCfg();
      if (cur) {
        cur.error = e instanceof TypeError || navigator.onLine === false ? '오프라인이에요. 연결되면 다시 동기화해요' : e.message;
        setCfg(cur);
      }
    } finally {
      syncing = false;
      showSync();
      if (syncAgain) { syncAgain = false; syncNow(); }
    }
  }

  function openSyncSheet() {
    const cfg = getCfg();
    if (cfg && cfg.token) {
      openSheet(`<form>
        <h3>동기화 연결됨</h3>
        <p class="goal-hint">저장소: ${escapeHtml(cfg.repo)}<br>연결을 해제해도 이 기기의 데이터는 그대로 남아요.</p>
        <div class="sheet-actions"><button type="button" data-cancel>닫기</button><button type="submit" style="background:var(--expense)">연결 해제</button></div>
      </form>`, () => {
        localStorage.removeItem(SYNC_KEY);
        showSync();
        showToast('연결을 해제했어요');
      });
      return;
    }
    openSheet(`<form>
      <h3>동기화 연결</h3>
      <label>비공개 저장소 (소유자/이름)</label>
      <input name="repo" required placeholder="예: 내아이디/dadari-data" autocomplete="off" autocapitalize="off">
      <label>접근 토큰</label>
      <input name="token" type="password" required autocomplete="off" autocapitalize="off">
      <p class="goal-hint">그 저장소 하나에만 Contents 읽기·쓰기 권한을 준 토큰을 넣어 주세요. 토큰은 이 기기에만 저장되고 백업 파일에는 들어가지 않아요. 폰과 컴퓨터에서 각각 한 번씩 연결하면 돼요.</p>
      <div class="sheet-actions"><button type="button" data-cancel>취소</button><button type="submit">연결</button></div>
    </form>`, (fd) => {
      const repo = String(fd.get('repo')).trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$/, '').replace(/\/$/, '');
      const token = String(fd.get('token')).trim();
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) { showToast('저장소 이름(소유자/이름)과 토큰을 확인해 주세요'); return false; }
      setCfg({ repo, token, sha: null, dirty: !!hasData(), seq: 0, last: 0, error: '' });
      showSync();
      syncNow();
    });
  }
  el('sync-setup').addEventListener('click', openSyncSheet);
  el('sync-now').addEventListener('click', () => syncNow(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
  window.addEventListener('online', () => syncNow());
  setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 60000);

  /* ---------- 영수증 사진 ---------- */
  // 사진은 localStorage에 들어가기엔 커서 IndexedDB에 기록 id로 저장한다. 백업 JSON에는 포함되지 않는다.
  let pendingBlob = null;
  let ocrToken = 0;
  let dateTouched = false;
  let viewerUrl = null;
  dateInput.addEventListener('input', () => { dateTouched = true; });

  function openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('dadari', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('receipts');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function receiptTx(mode, fn) {
    const db = await openDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('receipts', mode);
      const req = fn(tx.objectStore('receipts'));
      tx.oncomplete = () => { db.close(); resolve(req.result); };
      tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
    });
  }
  const putReceipt = (id, blob) => receiptTx('readwrite', (s) => s.put(blob, id));
  const getReceipt = (id) => receiptTx('readonly', (s) => s.get(id));
  const delReceipt = (id) => receiptTx('readwrite', (s) => s.delete(id));

  // 긴 변 1600px 이하 JPEG로 줄여 용량을 아끼고 글자 인식에 충분한 해상도는 남긴다.
  function shrinkImage(file, max = 1600) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s);
        c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob'))), 'image/jpeg', 0.72);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }

  function clearReceipt() {
    ocrToken++;
    pendingBlob = null;
    const thumb = el('rc-thumb');
    if (thumb.src.startsWith('blob:')) URL.revokeObjectURL(thumb.src);
    thumb.removeAttribute('src');
    thumb.hidden = true;
    el('rc-remove').hidden = true;
    el('rc-status').textContent = '';
  }

  el('f-receipt').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    clearReceipt();
    try {
      pendingBlob = await shrinkImage(file);
    } catch (err) {
      showToast('사진을 불러오지 못했어요');
      return;
    }
    el('rc-thumb').src = URL.createObjectURL(pendingBlob);
    el('rc-thumb').hidden = false;
    el('rc-remove').hidden = false;
    readReceipt(pendingBlob);
  });
  el('rc-remove').addEventListener('click', clearReceipt);

  async function showReceipt(id) {
    try {
      const blob = await getReceipt(id);
      if (!blob) { showToast('이 기기에는 저장된 사진이 없어요'); return; }
      if (viewerUrl) URL.revokeObjectURL(viewerUrl);
      viewerUrl = URL.createObjectURL(blob);
      el('viewer-img').src = viewerUrl;
      el('viewer').hidden = false;
    } catch (err) {
      showToast('사진을 불러오지 못했어요');
    }
  }
  const closeViewer = () => { el('viewer').hidden = true; };
  el('viewer-close').addEventListener('click', closeViewer);
  el('viewer').addEventListener('click', (e) => { if (e.target === el('viewer')) closeViewer(); });

  /* ---------- 영수증 글자 읽기 (OCR) ---------- */
  // 처음 사용할 때만 Tesseract.js와 한글 언어 데이터를 내려받는다. 사진은 기기 밖으로 나가지 않는다.
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
      s.onload = () => resolve(window.Tesseract);
      s.onerror = () => reject(new Error('load'));
      document.head.appendChild(s);
    });
  }

  function parseReceipt(text) {
    const lines = text.split('\n').map((s) => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
    const numbers = (s) => (s.match(/\d{1,3}(?:[,.]\d{3})+|\d{3,9}/g) || [])
      .map((x) => parseInt(x.replace(/[,.]/g, ''), 10))
      .filter((n) => n >= 100 && n < 100000000);
    const skip = /부가세|세액|VAT|과세|면세|할인|포인트|적립|\d{2,4}-\d{3,4}-\d{4}/i;
    const keyword = /합\s*계|총\s*액|결제\s*(금액|요청)|받을\s*금액|청구\s*금액|판매\s*총액|TOTAL|AMOUNT/i;

    let amount = 0;
    lines.filter((l) => keyword.test(l) && !skip.test(l)).forEach((l) => {
      amount = Math.max(amount, ...numbers(l), 0);
    });
    if (!amount) {
      // 키워드를 못 찾으면 쉼표 형식(1,234)의 숫자 중 가장 큰 값을 후보로 쓴다.
      lines.filter((l) => !skip.test(l)).forEach((l) => {
        (l.match(/\d{1,3}(?:,\d{3})+/g) || []).forEach((x) => { amount = Math.max(amount, parseInt(x.replace(/,/g, ''), 10)); });
      });
    }

    let date = '';
    const m = text.match(/(20\d{2})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
    if (m) {
      const mo = +m[2], d = +m[3];
      const cand = m[1] + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && cand <= todayStr()) date = cand;
    }
    return { amount, date };
  }

  async function readReceipt(blob) {
    const token = ++ocrToken;
    const status = el('rc-status');
    status.textContent = '영수증을 읽는 중이에요… (처음에는 언어 데이터를 받느라 1분쯤 걸릴 수 있어요)';
    try {
      const T = await loadTesseract();
      const { data } = await T.recognize(blob, 'kor+eng');
      if (token !== ocrToken) return;
      const r = parseReceipt(data.text);
      const done = [];
      if (r.amount && !el('f-amount').value) { el('f-amount').value = r.amount; done.push('금액 ' + formatWon(r.amount)); }
      if (r.date && !dateTouched) { dateInput.value = r.date; done.push('날짜 ' + r.date); }
      status.textContent = done.length
        ? '읽은 값: ' + done.join(', ') + ' — 맞는지 꼭 확인하세요'
        : '금액을 읽지 못했어요. 직접 입력해 주세요';
    } catch (err) {
      if (token !== ocrToken) return;
      status.textContent = '글자를 읽지 못했어요(인터넷 연결이 필요해요). 사진만 첨부해도 돼요';
    }
  }

  /* ---------- PWA ---------- */
  const APP_VERSION = 'v8'; // deploy.sh가 sw.js 버전과 함께 올린다
  el('ver').textContent = '다다리 가계부 ' + APP_VERSION;
  // 설치한 앱에는 브라우저 새로고침이 없어서, 서비스 워커를 갱신 확인한 뒤 페이지를 다시 불러온다.
  el('refresh-btn').addEventListener('click', async () => {
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
    } catch (err) {}
    location.reload();
  });
  let installEvt = null;
  const installCard = el('install-card');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone) {
    installCard.hidden = false;
    el('install-hint').textContent = /iPhone|iPad|iPod/.test(navigator.userAgent)
      ? 'Safari 공유 버튼 → “홈 화면에 추가”를 눌러 주세요.'
      : '브라우저 메뉴 → “앱 설치” 또는 “홈 화면에 추가”를 눌러 주세요.';
  }
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installEvt = e;
    el('install-btn').hidden = false;
    el('install-hint').hidden = true;
  });
  el('install-btn').addEventListener('click', () => {
    if (!installEvt) return;
    installEvt.prompt();
    installEvt.userChoice.then(() => {
      installEvt = null;
      installCard.hidden = true;
    });
  });
  window.addEventListener('appinstalled', () => {
    installCard.hidden = true;
    showToast('설치했어요');
  });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  applyRecurs();
  renderCardOptions();
  updatePayVisibility();
  renderAll();
  const savedView = loadJson(VIEW_KEY, 'ledger');
  setView(savedView === 'schedule' || savedView === 'health' ? savedView : 'ledger');
  showSync();
  syncNow();
})();
</script>

</body>
</html>
