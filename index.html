<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다다리">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>다다리 가계부</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --income: #16a34a;
    --income-soft: #ecfdf3;
    --expense: #dc2626;
    --expense-soft: #fef2f2;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --card-bg: #1e2027;
      --text: #eef0f3;
      --text-muted: #9aa0ab;
      --border: #2c2f38;
      --accent: #818cf8;
      --accent-soft: #23253a;
      --income: #4ade80;
      --income-soft: #1b2b20;
      --expense: #f87171;
      --expense-soft: #2c1c1c;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 8px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
    padding-bottom: 40px;
  }
  header {
    padding: 24px 20px 12px;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }
  .refresh-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .ver { text-align: center; color: var(--text-muted); font-size: 11px; margin: 20px 0 0; }
  header h1 {
    font-size: 22px;
    margin: 0 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 13px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .month-nav button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
  }
  .month-nav .label {
    font-size: 16px;
    font-weight: 600;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .summary-item {
    border-radius: 10px;
    padding: 12px 10px;
    text-align: center;
  }
  .summary-item .lbl {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .summary-item .val {
    font-size: 15px;
    font-weight: 700;
  }
  .summary-item.income { background: var(--income-soft); }
  .summary-item.expense { background: var(--expense-soft); }
  .summary-item.balance { background: var(--accent-soft); }
  .summary-item.income .val { color: var(--income); }
  .summary-item.expense .val { color: var(--expense); }
  .summary-item.balance .val { color: var(--accent); }

  h2.section-title {
    font-size: 14px;
    margin: 0 0 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  form#entry-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  form#entry-form .full { grid-column: 1 / -1; }
  .type-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .type-toggle button {
    flex: 1;
    padding: 10px;
    border: none;
    background: var(--card-bg);
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .type-toggle button.active[data-type="expense"] {
    background: var(--expense-soft);
    color: var(--expense);
  }
  .type-toggle button.active[data-type="income"] {
    background: var(--income-soft);
    color: var(--income);
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  button.submit-btn {
    grid-column: 1 / -1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button.submit-btn:active { opacity: 0.85; }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .bar-row .cat-name {
    width: 64px;
    flex-shrink: 0;
    color: var(--text-muted);
  }
  .bar-row .bar-track {
    flex: 1;
    height: 10px;
    background: var(--bg);
    border-radius: 6px;
    overflow: hidden;
  }
  .bar-row .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 6px;
  }
  .bar-row .cat-amt {
    width: 74px;
    text-align: right;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .tx-list { display: flex; flex-direction: column; gap: 8px; }
  .tx-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  .tx-item:last-child { border-bottom: none; }
  .tx-main { display: flex; flex-direction: column; gap: 2px; }
  .tx-cat { font-size: 14px; font-weight: 600; }
  .tx-meta { font-size: 12px; color: var(--text-muted); }
  .tx-amt { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tx-amt.income { color: var(--income); }
  .tx-amt.expense { color: var(--expense); }
  .tx-actions { display: flex; gap: 6px; margin-left: 10px; }
  .tx-actions button {
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    padding: 4px;
  }
  .empty-msg {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 20px 0;
  }
  .backup-row {
    display: flex;
    gap: 10px;
  }
  .backup-row button, .backup-row label {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .backup-row input[type="file"] { display: none; }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 10;
  }
  .toast.show { opacity: 1; }

  .goal-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .goal-row button {
    flex-shrink: 0;
    padding: 0 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .goal-hint { font-size: 12px; color: var(--text-muted); margin: 6px 0 0; }
  .week { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 12px; color: var(--text-muted); }
  .week.current { background: var(--accent-soft); }
  .week .line { display: flex; justify-content: space-between; margin: 4px 0; }
  .week .name { font-size: 13px; font-weight: 600; color: var(--text); }
  .week .name em {
    font-style: normal;
    font-size: 10px;
    background: var(--accent);
    color: white;
    border-radius: 99px;
    padding: 1px 7px;
    margin-left: 4px;
  }
  .week .track { height: 8px; background: var(--bg); border-radius: 6px; overflow: hidden; }
  .week .fill { height: 100%; background: var(--accent); border-radius: 6px; }
  .week .fill.near { background: #d97706; }
  .week .fill.over { background: var(--expense); }
  .week .over-text { color: var(--expense); }
  .receipt-row { display: flex; align-items: center; gap: 10px; }
  label.receipt-btn {
    display: inline-block;
    margin: 0;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px dashed var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  #rc-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  #rc-remove { border: none; background: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 6px; }
  .viewer {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
  }
  .viewer[hidden] { display: none; }
  .viewer img { max-width: 100%; max-height: calc(100vh - 90px); object-fit: contain; border-radius: 8px; }
  .viewer button {
    padding: 10px 28px;
    border: none;
    border-radius: 20px;
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .cardbox { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; }
  .cardbox:first-child { margin-top: 0; }
  .cardhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .cardhead b { font-size: 15px; }
  .tag { font-size: 10px; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 1px 7px; margin-left: 4px; vertical-align: 1px; }
  .cardsub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .icon-btn { border: none; background: none; color: var(--text-muted); font-size: 15px; cursor: pointer; padding: 4px; flex-shrink: 0; }
  .rec { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); margin-top: 8px; }
  .rec > div:first-child { flex: 1; min-width: 0; }
  .rec-name { font-size: 13px; font-weight: 600; }
  .rec-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .rec-amt { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cards-actions { display: flex; gap: 8px; margin-top: 12px; }
  .mini-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .sheet-wrap {
    position: fixed;
    inset: 0;
    z-index: 15;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet-wrap[hidden] { display: none; }
  .sheet-body {
    width: 100%;
    max-width: 720px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--card-bg);
    border-radius: 18px 18px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-body h3 { margin: 0 0 14px; font-size: 16px; }
  .sheet-body label { margin-top: 10px; }
  .sheet-body .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); margin-top: 14px; }
  .sheet-body .check input { width: auto; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
  .sheet-actions button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
  .sheet-actions [data-cancel] { background: var(--bg); color: var(--text); }
  .sheet-actions [type="submit"] { background: var(--accent); color: white; flex: 2; }
  main[hidden], .day-tabs[hidden], .member-chips[hidden] { display: none; }
  label.chk { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; color: var(--text); cursor: pointer; }
  label.chk input { width: auto; margin: 0; }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .list-head .section-title { margin: 0; }
  .list-head label.chk { color: var(--text-muted); font-size: 12px; }
  .fx-sum { font-weight: 400; font-size: 12px; margin-left: 6px; }
  .fx-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
  .fx-row:first-child { border-top: none; }
  .fx-row span { color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-row span em { font-style: normal; color: var(--text); }
  .viewtabs button { padding: 10px 4px; font-size: 13px; }
  .h-sec { font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 14px 0 4px; }
  .h-sec:first-child { margin-top: 0; }
  .visit { display: block; width: 100%; text-align: left; padding: 10px 4px; border: none; border-top: 1px solid var(--border); background: none; color: var(--text); font-size: 14px; cursor: pointer; }
  .visit .v1 { display: flex; justify-content: space-between; gap: 8px; }
  .visit .v2 { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .visit .dd { font-weight: 700; color: var(--accent); }
  .who-tag { font-size: 10px; background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .cyc-sum { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.7; }
  .cyc-sum b { font-size: 15px; }
  .cyc-note { font-size: 11px; color: var(--text-muted); margin: 8px 0 0; }
  .cyc-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 14px 0 6px; font-weight: 600; }
  .cyc-nav button { border: 1px solid var(--border); background: none; color: var(--text); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; }
  .cyc-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 12px; }
  .cyc-grid .dow { color: var(--text-muted); font-size: 11px; padding: 3px 0; }
  .cyc-grid button { height: 36px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--text); font-size: 12px; cursor: pointer; padding: 0; }
  .cyc-grid button.period { background: var(--expense); color: #fff; }
  .cyc-grid button.pred { border: 1px dashed var(--expense); color: var(--expense); }
  .cyc-grid button.fert { background: var(--accent-soft); color: var(--accent); }
  .cyc-grid button.ovul { border-color: var(--accent); font-weight: 700; }
  .cyc-grid button.today { outline: 2px solid var(--text); outline-offset: -2px; }
  .cyc-legend { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  .cyc-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .rec-amt.inc { color: var(--income); }
  .fx-row b.income { color: var(--income); }
  .fx-row b.expense { color: var(--expense); }
  .fx-group { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .fx-group:first-child { margin-top: 0; border-top: none; padding-top: 0; }
  .fx-group b.income { color: var(--income); }
  .fx-group b.expense { color: var(--expense); }
  .fix-btn { opacity: 0.3; }
  .fix-btn.on { opacity: 1; }
  .viewtabs { display: flex; gap: 8px; max-width: 720px; margin: 0 auto 12px; padding: 0 20px; }
  .viewtabs button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .viewtabs button.active { background: var(--accent); border-color: var(--accent); color: white; }
  .day-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .day-tabs button {
    flex: 1;
    padding: 9px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .day-tabs button.today { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .day-tabs button.active { background: var(--accent); border-color: var(--accent); color: white; }
  .sch-modes { display: flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
  .sch-modes button { flex: 1; padding: 9px; border: none; background: var(--card-bg); color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .sch-modes button.active { background: var(--accent-soft); color: var(--accent); }
  .sch-member { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; }
  .sch-member:first-of-type { margin-top: 0; }
  .sch-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .sch-head b { font-size: 15px; }
  .sch-item {
    display: flex;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 9px 4px;
    border: none;
    border-top: 1px solid var(--border);
    background: none;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .sch-item:first-of-type { border-top: none; }
  .sch-time { width: 64px; flex-shrink: 0; color: var(--text-muted); font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .sch-title { flex: 1; }
  .sch-note { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .sch-item.now { background: var(--accent-soft); border-radius: 8px; }
  .sch-item.now .sch-time { color: var(--accent); font-weight: 700; }
  .sch-tag { font-size: 10px; background: var(--accent); color: white; border-radius: 99px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .member-chips { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .member-chips button { padding: 7px 14px; border-radius: 99px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer; }
  .member-chips button.active { background: var(--accent); border-color: var(--accent); color: white; }
  .week-wrap { overflow-x: auto; }
  table.week { border-collapse: collapse; width: 100%; font-size: 11px; min-width: 520px; }
  table.week th, table.week td { border: 1px solid var(--border); padding: 5px 4px; vertical-align: top; text-align: center; }
  table.week th { background: var(--bg); color: var(--text-muted); font-weight: 600; }
  table.week td.t { white-space: nowrap; color: var(--text-muted); background: var(--bg); }
  table.week th:first-child, table.week td.t { position: sticky; left: 0; z-index: 1; }
  table.week th.today { color: var(--accent); }
  table.week button { border: none; background: none; color: var(--text); font-size: 11px; cursor: pointer; padding: 0; line-height: 1.35; }
  .days-check { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .days-check label.d { display: inline-flex; align-items: center; gap: 4px; margin: 0; padding: 7px 10px; border: 1px solid var(--border); border-radius: 99px; font-size: 13px; color: var(--text); }
  .days-check input { width: auto; margin: 0; }
  .sheet-actions [data-delete] { background: var(--expense-soft); color: var(--expense); flex: 1; }
  .install-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <button class="refresh-btn" id="refresh-btn" type="button" aria-label="새로고침">🔄 새로고침</button>
  <h1>🪜 다다리 가계부</h1>
  <p>매일의 수입과 지출을 가볍게 기록해요</p>
</header>
